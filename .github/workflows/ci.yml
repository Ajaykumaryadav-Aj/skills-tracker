name: Skills Tracker CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm run install:all

    - name: Lint Codebase
      run: |
        npm --prefix server run lint || echo "Lint warnings ignored on server"
        npm --prefix client run lint || echo "Lint warnings ignored on client"

    - name: Run Backend Integration & Unit Tests
      env:
        MONGO_URI: mongodb://localhost:27017/skills-tracker-test
        JWT_SECRET: testing_jwt_secret_should_be_at_least_32_characters_long
        NODE_ENV: test
      run: |
        # Start a local MongoDB service in GitHub Actions
        docker run -d -p 27017:27017 mongo:latest
        sleep 5
        npm --prefix server run test

    - name: Run Frontend Component Tests
      run: npm --prefix client run test

    - name: Verify Monorepo Builds
      run: npm run build
